[pytest]
# Keep pytest's temporary directories OFF /tmp.
#
# On this box /tmp is a 921 MB tmpfs -- it is RAM, and serve.py already carries
# that warning about uploads. The liveroom tests convolve 26-second wavs twenty
# four times per search, and on 2026-09-03 one run of this suite put 195 MB into
# /tmp and filled it to 100%. What that looks like is not an out-of-disk error:
# it looks like twelve tests erroring at fixture setup in 0.7 seconds, which is
# indistinguishable at a glance from a broken import, and it silently
# invalidated three mutation runs before I looked at `df`.
#
# `--basetemp` is wiped and recreated on every run, so it points at a dedicated
# scratch directory and never at anything with work in it.
addopts = --basetemp=work/pytest
testpaths = tests
