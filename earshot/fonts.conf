<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Why this file exists.

  `fc-list` on this box returns nothing. That is not fontconfig reporting an
  empty font set: fc-list is NOT INSTALLED, and an absent command prints nothing
  and exits, which looks exactly like a command reporting zero. There are 95
  font files here, unpacked out of RPMs alongside chromium on 2026-09-01, and
  nothing had ever told fontconfig where they were.

  Without this, libass still renders. That is the dangerous part. It falls back
  to a thin grey serif at default size: ffmpeg exits 0, every frame is written,
  and the words are invisible the moment there is a picture behind them.
  Measured on a black test frame: 180 non-black pixels without this file, 1372
  with it.

  Pointed at by video._env() rather than by whoever starts the process, because
  the same class of environment bug has cost this project three evenings from
  the launcher side.
-->
<fontconfig>
  <dir>~/sysroot/usr/share/fonts</dir>
  <dir>/usr/share/fonts</dir>
  <dir>~/.local/share/fonts</dir>
  <cachedir>~/.cache/fontconfig</cachedir>

  <!-- libass asks for these by name when a style does not name a font. -->
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="same"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Arial</string></test>
    <edit name="family" mode="prepend" binding="same"><string>DejaVu Sans</string></edit>
  </match>
</fontconfig>
